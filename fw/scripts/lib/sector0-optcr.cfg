# openocd script: read FLASH_OPTCR and print it as ONE line, OPTCR=0x........
# then let the core run again and exit. Passed with -f by scripts/provision.sh's
# reachability preflight; the line is parsed by sector0_wrp_reported in
# lib/sector0.sh, which says what the bits mean.
#
# WHY A SCRIPT FILE AND NOT -c. The openocd on the lathe's probe host (0.12.0+dev,
# snapshot 2026-02-16, ST-Link V2, STM32F411) prints NOTHING for `flash info 0`,
# `mdw` or `stm32f2x options_read` given with -c: the output holds only the
# Info and halt lines. A Tcl echo from a file given with -f does print. Both
# verified by hand on that machine 2026-09-24. Readings from the real board:
#   OPTCR=0x0fffaacd   no sector protected
#   OPTCR=0x0ffeaacd   sector 0 protected
#
# FLASH_OPTCR is 0x40023C14 (RM0383). One 32-bit word.

init
reset halt

if {[catch {read_memory 0x40023C14 32 1} optcr_words]} {
    echo "OPTCR=unreadable"
} else {
    echo [format "OPTCR=0x%08x" [lindex $optcr_words 0]]
}

# openocd exiting does not resume a halted core, and on --dry-run or an abort
# there is no later write step to reset it. The read is inside a catch so a
# failed read still reaches this line.
reset run
shutdown
