name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install headless runtime libs (insurance)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libmtdev1 xclip
      # Kivy is forced onto mock GL/window backends for the whole suite (see
      # repo-root conftest.py), so no real GL context or display is needed to
      # collect/run these tests. Installed anyway as cheap insurance: some
      # Kivy submodules probe for these libs at import time regardless of
      # which backend ends up selected -- GL bindings (libgl1), mtdev touch
      # input (libmtdev1), and the xclip-based Linux clipboard provider.

    - name: Install uv and sync deps
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv
        uv sync

    # pyproject.toml's [tool.pytest.ini_options] addopts is `-m 'not system'`,
    # so this is the default (non-system) suite -- currently 481 tests. The
    # emulator-backed `system`-marked suite runs separately below.
    - name: Run tests
      run: uv run --frozen pytest -q

  # Best-effort: builds the reflex-fw emulator from source and runs the
  # emulator-backed system suite against it. reflex-fw is a public sibling
  # repo (anonymous checkout below), so no PAT/secret is required today; if
  # it's ever made private this job will need a PAT with read access stored
  # as a secret and passed via `with: token:` on the reflex-fw checkout step.
  # continue-on-error so a flaky/slow emulator build never blocks the
  # required `test` job above.
  system-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20

    steps:
    - name: Checkout reflex-ui
      uses: actions/checkout@v4
      with:
        path: reflex-ui

    # Pick the reflex-fw ref to pair with. SAME BRANCH NAME FIRST.
    #
    # A feature branch — or integration — routinely carries firmware and UI
    # changes that only make sense together: a new Modbus register, a new
    # emulator command, a firmware gate the UI drives. Pinning one fixed ref
    # here makes exactly that class of change untestable, and it fails in a way
    # that reads like a product defect rather than a pairing mistake.
    #
    # 2026-08-10 is the worked example: `feat/els-slip-attribution` existed in
    # BOTH repos, and CI paired the UI branch against dev-staging anyway —
    # firmware predating the entire closed-loop take-up feature. Both new tests
    # failed with "the take-up gate never published an outcome", which says
    # nothing about the code under test.
    #
    # Fallbacks, in order, for a branch that exists in only one repo:
    #   integration  — where feature work converges, so the best guess for
    #                  anything modern
    #   dev-staging  — HW-verified (AGENTS.md); the previous hardcoded value
    #   dev          — reflex-fw's default branch, which lags dev-staging
    #
    # The chosen ref is echoed to the job summary, so a red run names its own
    # pairing instead of making you go and look.
    - name: Resolve reflex-fw pairing ref
      id: fwref
      env:
        # head_ref is the source branch on pull_request events, where ref_name
        # would be the synthetic "<pr>/merge".
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        FW=https://github.com/Funkenjaeger/reflex-fw
        for ref in "$BRANCH" integration dev-staging dev; do
          if git ls-remote --exit-code --heads "$FW" "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            if [ "$ref" = "$BRANCH" ]; then
              why="matching branch name"
            else
              why="fallback; reflex-fw has no branch '$BRANCH'"
            fi
            echo "### reflex-fw pairing: \`$ref\` ($why)" >> "$GITHUB_STEP_SUMMARY"
            echo "Pairing reflex-fw @ $ref ($why)"
            exit 0
          fi
        done
        echo "::error::no reflex-fw ref resolved for branch '$BRANCH'"
        exit 1

    - name: Checkout reflex-fw
      uses: actions/checkout@v4
      with:
        repository: Funkenjaeger/reflex-fw
        ref: ${{ steps.fwref.outputs.ref }}
        path: reflex-fw

    - name: Install emulator build deps (insurance)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
      # tests/system/conftest.py's `emulator_binary` fixture shells out to
      # `cmake -B build` / `cmake --build build` in reflex-fw/emulator on
      # first use, compiling the real firmware C sources (Ramps.c, Modbus.c,
      # Scales.c, UARTCallback.c) against a host HAL/FreeRTOS shim plus the
      # C++ emulator (links only pthread + m, both part of the standard
      # toolchain). ubuntu-latest ships cmake and build-essential already;
      # installed explicitly anyway as insurance against runner-image drift.

    - name: Install uv and sync deps
      working-directory: reflex-ui
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv
        uv sync

    - name: Run system tests
      working-directory: reflex-ui
      env:
        # Points the emulator_binary fixture at the sibling checkout above
        # (its default assumes a WSL dev-machine layout under /mnt/c/...).
        REFLEX_FW_DIR: ${{ github.workspace }}/reflex-fw
      run: uv run --frozen pytest -m system tests/system -q
