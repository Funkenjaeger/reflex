name: Release

on:
  push:
    branches:
      - main
      - dev

permissions: write-all

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install headless GL deps
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgl1-mesa-dri libgles2-mesa-dev

    - name: Install uv and sync deps
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv
        uv sync

    # Regenerate the README screenshots into docs/screenshots/ BEFORE the
    # release step. semantic-release commits these (via its `assets` config in
    # pyproject.toml) as part of the version-bump commit, so they auto-update
    # per-branch. The release commit is pushed with GITHUB_TOKEN, which does not
    # re-trigger this workflow — no loop.
    - name: Capture README screenshots
      env:
        SDL_AUDIODRIVER: dummy
        LIBGL_ALWAYS_SOFTWARE: "1"
        OUT_DIR: docs/screenshots
      run: |
        xvfb-run -a -s "-screen 0 1024x600x24" \
          uv run python scripts/capture_readme_screenshots.py

    - name: Python Semantic Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ./.venv/bin/semantic-release version
