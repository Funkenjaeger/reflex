; Reflex UI theme. Copy this file to ~/.config/reflex/themes/ to
; customize or create your own theme, then pick it in Format Settings.
; Colors are r, g, b, a in 0..1. Lines starting with ; are comments.

[meta]
label = Light Aluminum

; Aluminum: retuned to the Claude Design handoff tokens. Surfaces sit brighter
; and borders/wells lighter than the first prototype, so the gradient dome and
; the bright top sheen read like brushed metal instead of flat grey card stock.
[colors]
background = 0.851, 0.863, 0.871, 1
surface = 0.952, 0.957, 0.961, 1
; surface_sheen = 1px top inner highlight LINE (bright on light alu).
surface_sheen = 1, 1, 1, 0.95
; recess/tab faces are FLAT. Spine + wells sit darker than the bg so the lighter
; tabs read against the channel and the wells carve in (matches the reference).
recess = 0.804, 0.82, 0.828, 1
tab_bg = 0.906, 0.918, 0.925, 1
; Aluminum accent = deep navy (#123456). LEDs are a separate amber (color_on
; seed, #FFB733) -- see [seeds]. Active selectors, Cut, Zero ring and the
; readouts use this navy; only the status/toggle LEDs are amber.
accent = 0.071, 0.204, 0.337, 1
accent_text = 0.086, 0.235, 0.388, 1
accent_bg = 0.74, 0.772, 0.812, 1
accent_soft = 0.071, 0.204, 0.337, 0.16
glow = 0.071, 0.204, 0.337, 0.26
border = 0.694, 0.714, 0.725, 1
border_dim = 0.737, 0.757, 0.769, 1
; edge_dark = recessed top inner-shadow; edge_light = bottom inner-highlight.
edge_dark = 0.157, 0.18, 0.204, 0.18
edge_light = 1, 1, 1, 0.75
; shadow = raised drop-shadow (light theme needs it to lift off the bg);
; edge_shadow = strong directional shadow at the tab spine's right edge.
shadow = 0.157, 0.18, 0.204, 0.18
edge_shadow = 0.157, 0.18, 0.204, 0.28
text = 0.173, 0.192, 0.208, 1
text_dim = 0.553, 0.58, 0.604, 1
text_disabled = 0.55, 0.575, 0.6, 1
success = 0.08, 0.48, 0.18, 1
success_text = 0.06, 0.34, 0.13, 1
success_bg = 0.78, 0.9, 0.78, 1
danger = 0.74, 0.1, 0.1, 1
danger_text = 0.5, 0.04, 0.04, 1
danger_bg = 0.96, 0.8, 0.78, 1
danger_glow = 0.8, 0.12, 0.12, 0.26
warning = 0.64, 0.33, 0, 1
led_off = 0.651, 0.678, 0.698, 1
; readout_ghost = unlit off-segments; a navy tint (matching the readout) dark
; enough to read clearly against the light bg.
readout_ghost = 0.18, 0.28, 0.42, 0.5
plot_bg = 0.835, 0.851, 0.859, 1
plot_grid = 0.722, 0.745, 0.757, 1
plot_tool = 0.8, 0.18, 0.18, 1

[paths]
logo = pictures/reflex_logo_light.png
font_seg = fonts/DSEG7Classic-Regular.ttf
font_bold = fonts/ChakraPetch-SemiBold.ttf
font_icon = fonts/Font Awesome 6 Free-Solid-900.otf
font_mono = fonts/ShareTechMono-Regular.ttf

[seeds]
; Operator-configurable color seeds applied when this theme is
; selected (the DRO digit color and the on/off indicator lamp colors).
; DRO readout = navy (#163C63). LED "on" = bright amber (#FFB733) -- the LEDs
; are deliberately near-complementary to the navy so they read as illuminated.
display_color = 0.086, 0.235, 0.388, 1
color_on = 1.0, 0.718, 0.2, 1
color_off = 0.651, 0.678, 0.698, 1
