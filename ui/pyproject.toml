[project]
name = "reflex"
version = "1.0.0-rc.2"
description = "Reflex UI"
authors = [
    { name = "Stefano Bertelli", email = "stefano@provvedo.com" },
    { name = "Evan Dudzik" }
]
requires-python = ">=3.11,<4.0"
license = "MIT"
readme = "README.md"
dependencies = [
    "cachetools>=5.5.0",
    "keke>=0.1.4",
    "kivy>=2.3.0",
    "minimalmodbus>=2.1.1",
    "nmcli>=1.5.0",
    "pydantic>=2.10.3",
    "pyyaml>=6.0.2",
    "aiohttp>=3.9.0",
    "sentry-sdk>=2.32.0",
    "transitions>=0.9.3",
]

[dependency-groups]
dev = [
    "coverage>=7.6.9",
    "pytest>=8.3.4",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not system'"  # explicit `-m system` on the CLI overrides this
markers = [
    "system: emulator-backed end-to-end system tests (requires the reflex-fw emulator; slow, excluded from default `uv run pytest` runs -- invoke explicitly with `-m system`)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# python-semantic-release was RETIRED with the split repos (2026-08-22).
#
# Its config here had accumulated v7 keys that PSR 10 silently ignores, so
# several options read like live settings while doing nothing at all -- and
# nobody could say from this file what a push to dev would actually do. That
# ambiguity is where the `[skip ci]` habit came from, and on every branch but
# main/dev that marker deleted the test run and bought nothing.
#
# Releases are now cut by .github/workflows/release.yml: ONE version for both
# halves of the monorepo, tagged `vX.Y.Z`, carrying the firmware binary and
# this package's wheel on a single GitHub release. It is dispatched
# deliberately rather than firing on a push. The repo-root VERSION file is the
# source of truth and the workflow writes both it and the `version` field
# above -- do not bump either by hand.
