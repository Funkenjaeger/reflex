[project]
name = "reflex"
version = "1.0.0-rc.2"
description = "Reflex UI"
authors = [
    { name = "Stefano Bertelli", email = "stefano@provvedo.com" },
    { name = "Evan Dudzik" }
]
requires-python = ">=3.11,<4.0"
license = "MIT"
readme = "README.md"
dependencies = [
    "cachetools>=5.5.0",
    "keke>=0.1.4",
    "kivy>=2.3.0",
    "minimalmodbus>=2.1.1",
    "nmcli>=1.5.0",
    "pydantic>=2.10.3",
    "pyyaml>=6.0.2",
    "aiohttp>=3.9.0",
    "sentry-sdk>=2.32.0",
    "transitions>=0.9.3",
]

[dependency-groups]
dev = [
    "coverage>=7.6.9",
    "pytest>=8.3.4",
    "python-semantic-release>=9.15.2",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not system'"  # explicit `-m system` on the CLI overrides this
markers = [
    "system: emulator-backed end-to-end system tests (requires the reflex-fw emulator; slow, excluded from default `uv run pytest` runs -- invoke explicitly with `-m system`)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.semantic_release]
# python-semantic-release 10 silently ignores keys it does not recognize, so
# options carried over from the v7 schema read like live settings while doing
# nothing at all. `patch_without_tag`, `remove_dist` and `upload_to_pypi` were
# dropped on 2026-08-11. The first of those was believed to force a release on
# every main/dev push, which is where the habit of writing `[skip ci]` came
# from -- see AGENTS.md, "Git and Releases", for why that habit cost test runs.
# Still inert, left pending a deliberate call: `branch`, `hvcs`, and the
# TOP-LEVEL `prerelease` below. The `prerelease` keys under
# [tool.semantic_release.branches.*] further down ARE live; do not confuse them.
version_toml = ["pyproject.toml:project.version"]
branch = "main"
hvcs = "github"
build_command = "uv build"
prerelease = false
# README screenshots regenerated by CI before this step; committed as part of
# the release commit so they auto-update per-branch (and render on private repos
# via relative paths). See .github/workflows/release.yml + scripts/capture_readme_screenshots.py.
assets = [
    "docs/screenshots/home_els_light.png",
    "docs/screenshots/home_els_dark.png",
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "rc"
