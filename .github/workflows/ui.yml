# UI default suite. Triggers include fw/Core/Inc because the cross-half
# contract tests (register map, schema/mode registries) read the firmware
# headers — a firmware-side header change must rerun them. It also checks the
# refusal catalog (docs/guide/when-it-refuses.md), which imports the app's
# message tables and so needs this job's venv; docs.yml defers it to here.
name: ui

on:
  push:
    paths:
      - "ui/**"
      - "fw/Core/Inc/**"
      - "tools/gen_refusal_catalogue.py"
      - "docs/guide/when-it-refuses.md"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - "fw/Core/Inc/**"
      - "tools/gen_refusal_catalogue.py"
      - "docs/guide/when-it-refuses.md"
      - ".github/workflows/ui.yml"

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    # timeout + checkout@v7: see fw.yml's header comment (2026-08-18 wedge;
    # the old repos had already moved off @v4 and the weld regressed it).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and sync deps
        working-directory: ui
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync
      # Fails when a refusal string or its advice changed and the page was
      # not regenerated, or the page was edited by hand. Verified, not
      # regenerated: see docs.yml's header for why.
      - name: The refusal catalog is current
        working-directory: ui
        run: uv run --frozen python ../tools/gen_refusal_catalogue.py --check
      - name: Run the default (non-system) suite
        working-directory: ui
        env:
          # The firmware is always in-repo; a skip in the contract tests can
          # only mean a broken resolver, and must fail loudly, not pass quietly.
          REFLEX_FW_REQUIRED: "1"
        # See scripts/run_tests.py: bulk in parallel, the wall-clock cases
        # serially, and one isolated retry as a safety net that never goes
        # quiet about having fired.
        run: uv run --frozen python scripts/run_tests.py -- -q
