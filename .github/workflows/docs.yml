name: docs

# The user guide. Builds on every push and PR so a broken link or a stale
# generated page fails there rather than on the published site; deploys to
# GitHub Pages only from main.
#
# THE GENERATED PAGES ARE VERIFIED, NOT REGENERATED HERE. `--check` fails the
# build when docs/guide/when-it-refuses.md or docs/reference/index.md disagrees
# with the code they are generated from. Regenerating in CI instead would let a
# reworded refusal reach the site without anyone reading the new wording.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/gen_*.py"
      - "ui/reflex/help/**"
      - "ui/reflex/utils/devices.py"
      - "ui/reflex/components/home/els_phase_offset_popup.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/gen_*.py"
      - "ui/reflex/help/**"
      - "ui/reflex/utils/devices.py"
      - "ui/reflex/components/home/els_phase_offset_popup.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install "mkdocs-material==9.7.7"

      # The reference index only reads filenames and headings, so it needs no
      # Kivy. The refusal catalogue imports the app's message tables and does;
      # it is checked in the ui job instead, which already has the venv.
      - name: The reference index is current
        run: python tools/gen_reference_index.py --check

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
