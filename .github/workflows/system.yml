# Full-stack system suite: the UI driving the compiled firmware emulator.
#
# NO continue-on-error. The split-era job carried it for runner flakiness,
# and on 2026-08-17 it masked a real, deterministic regression (stale
# firmware-path defaults) for three consecutive green runs. The suite is
# 47/47 on runners since; if genuine flake reappears, quarantine the flaky
# test explicitly rather than silencing the whole job.
name: system

on:
  push:
    paths:
      - "fw/**"
      - "ui/**"
      - ".github/workflows/system.yml"
  pull_request:
    paths:
      - "fw/**"
      - "ui/**"
      - ".github/workflows/system.yml"

jobs:
  system-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Install uv and sync deps
        working-directory: ui
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync
      - name: Run system tests against the in-repo firmware
        working-directory: ui
        run: uv run --frozen pytest -m system tests/system -q
