# Lockstep release: ONE version, ONE tag, ONE release carrying BOTH halves.
#
# This is the flow docs/design/decisions.md specifies. Its whole point is that
# `v1.4.0` names a known-good FIRMWARE + UI PAIR, so "which firmware does this
# UI expect?" is answered by the version number instead of tribal knowledge.
# Both halves therefore carry the same version even when only one changed; a
# byte-identical binary simply does not get re-deployed.
#
# THE TAG IS MADE BEFORE IT ARRIVES HERE. The maintainer's release tooling
# builds and tests the release, commits the version stamp (VERSION,
# ui/pyproject.toml and ui/uv.lock, one commit) on the head of dev or main,
# creates the annotated tag on that commit, and pushes branch and tag to this
# repository together. Pushing the tag starts this workflow, which checks the
# stamp, builds and tests both halves again FROM the tag, checks that every
# shipped image identifies as the tagged commit, and publishes the release. It
# never commits and never tags, so the history here and the maintainer's copy
# cannot diverge over a stamp this workflow made on its own.
#
# A RELEASE IS STILL DELIBERATE: it happens when a tag is pushed, and only tags
# shaped like a release start it (vX.Y.Z and vX.Y.Z-rc.N). A failed run is
# re-run by dispatch with the same tag; a dispatch with dry_run builds and checks
# a tag without publishing.
#
# The describing is done by hand: release-notes/<V>.md at the tagged commit is
# the release's written description (required, see the step that checks it), with
# the generated commit list appended beneath it.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release tag, with its v (e.g. v1.1.0 or v1.1.0-rc.1).'
        required: true
        type: string
      dry_run:
        description: 'Build and check everything, then stop before publishing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0        # the branch check and the release notes need the history

      # ── Guards, before anything is built ──────────────────────────────────
      # The tag is the release, so everything about it is checked first, from
      # the commit it points at:
      #   * its name is a release version, X.Y.Z or X.Y.Z-rc.N;
      #   * it is ANNOTATED (a lightweight tag carries no record of being made
      #     on purpose);
      #   * the commit's VERSION says that version;
      #   * a pre-release is on dev and a final on main. A release is a promise
      #     about a branch that has been through the ladder; integration and
      #     feature branches have not;
      #   * no release exists for it yet, unless this is a dry run.
      - name: Check the tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --force origin "+refs/tags/$TAG:refs/tags/$TAG"   # the tag object itself, as pushed
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            || { echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)."; exit 1; }
          V=${TAG#v}
          [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] \
            || { echo "::error::$TAG is not an annotated tag."; exit 1; }
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          [ "$(git show "$SHA:VERSION")" = "$V" ] \
            || { echo "::error::VERSION at $TAG says '$(git show "$SHA:VERSION")', not $V."; exit 1; }
          if echo "$V" | grep -q -- '-'; then PRE=true; BRANCH=dev; else PRE=false; BRANCH=main; fi
          git merge-base --is-ancestor "$SHA" "origin/$BRANCH" \
            || { echo "::error::$TAG is a $([ $PRE = true ] && echo pre-release || echo final) and must be on $BRANCH; ${SHA:0:7} is not."; exit 1; }
          if [ "${{ inputs.dry_run }}" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists."; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ok: $TAG, annotated, VERSION $V, on $BRANCH at ${SHA:0:7}"

      # EVERY RELEASE CARRIES A WRITTEN DESCRIPTION, from release-notes/<V>.md
      # at the tagged commit, written for a person deciding whether to install:
      # what changed, what to watch out for, what is experimental. The generated
      # commit list is appended beneath it. The heading must name THIS version,
      # which refuses the easy mistake of copying the previous release's file.
      - name: Refuse a release without written notes
        run: |
          V='${{ steps.v.outputs.version }}'
          F="release-notes/$V.md"
          [ -f "$F" ] || { echo "::error::$F does not exist at $TAG. Write the release description there and commit it before tagging."; exit 1; }
          HEAD=$(grep -m1 -v '^[[:space:]]*$' "$F")
          [ "$HEAD" = "## reflex v$V" ] || { echo "::error::$F must open with '## reflex v$V'; it opens with '$HEAD'."; exit 1; }
          BODY=$(grep -v '^[[:space:]]*$' "$F" | tail -n +2 | wc -l)
          [ "$BODY" -ge 3 ] || { echo "::error::$F has $BODY non-blank lines under its heading; that is not a description."; exit 1; }
          echo "ok: $F, $BODY lines under '## reflex v$V'"

      # ── Build both halves ─────────────────────────────────────────────────
      # Package list mirrors fw.yml's arm-build; the two must stay in step so
      # the CI guard actually reproduces what ships.
      - name: Install ARM toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y \
            coreutils procps make cmake \
            build-essential gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib \
            libnewlib-arm-none-eabi

      # uv, for the version-parity gate's lock, the UI sync and the tests.
      # $HOME/.local/bin is already on the runner's PATH; exporting it through
      # $GITHUB_PATH says so out loud rather than relying on it.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      # THE GATE ON THE STAMP, and it reads the COMMIT rather than the working
      # tree. The claim being made is "the commit this release tags carries a
      # lock that declares its own version", so the thing to open is
      # `git show <stamp sha>:ui/uv.lock` -- exactly as the identity guard below
      # reads the bytes that ship instead of the build log. A working-tree check
      # would pass just as happily on a lock that `git add` never picked up.
      #
      # It runs HERE, before the ~10 minutes of firmware builds, because nothing
      # it reads depends on them; a version mismatch should cost seconds.
      #
      # Versions are compared CANONICALLY -- VERSION says 1.1.0-rc.1 where uv
      # writes 1.1.0rc1 -- which is why this is a script and not a `grep -q`.
      # The self-test runs first, against fixtures that must pass and fixtures
      # that must fail (including the exact 1.1.0-vs-1.1.0rc1 shape measured on
      # integration), so every release re-proves the guard can go red. Two
      # guards in this file have shipped unable to fail; assume this one is next
      # unless it demonstrates otherwise on every run.
      - name: Refuse a tagged commit whose uv.lock is not this version
        run: |
          SHA=${{ steps.v.outputs.sha }}
          git show "$SHA:VERSION"           > "$RUNNER_TEMP/VERSION"
          git show "$SHA:ui/uv.lock"        > "$RUNNER_TEMP/uv.lock"
          git show "$SHA:ui/pyproject.toml" > "$RUNNER_TEMP/pyproject.toml"
          python3 ui/scripts/lock_version_parity.py self-test
          if ! python3 ui/scripts/lock_version_parity.py check "$RUNNER_TEMP/uv.lock" \
                 --version-file "$RUNNER_TEMP/VERSION" \
                 --pyproject "$RUNNER_TEMP/pyproject.toml"; then
            echo "::error::the tagged commit's ui/uv.lock does not declare v${{ steps.v.outputs.version }} -- a checkout of this tag would disagree with itself about its own version."
            exit 1
          fi

      # TWO firmware binaries ship and they are NOT interchangeable. Until
      # 2026-09-07 only the legacy monolith was built, which meant the only
      # firmware a release published was the one the field updater cannot
      # flash; that legacy configuration was retired here on 2026-09-13 (see
      # the RETIRED note further down).
      #
      #   build-slot/    the application linked at the bootloader's RUN slot,
      #                  0x08020000, with the RFLX header at +0x200 patched in
      #                  post-build by scripts/reflex_image.py. This is the
      #                  ONLY form fw/scripts/modbus-flash.py -- and so the
      #                  in-app updater, ui/reflex/utils/updater.py -- will
      #                  accept; an unslotted binary is refused at its
      #                  preflight.
      #   bootloader/    sector 0 itself. A virgin board has no bootloader, so
      #                  without this asset the over-the-wire path cannot be
      #                  reached at all.
      #
      # Separate build directories per configuration, the way DIAG.md keeps
      # diagnostic builds apart: one directory reconfigured twice would leave
      # a stale cache deciding what the second build meant. That still holds
      # with two configurations -- build-slot/ and bootloader/build/ are
      # configured differently and neither may inherit the other's cache.
      - name: Cross-build the release firmware
        working-directory: fw
        run: |
          cmake -S . -B build-slot -DCMAKE_BUILD_TYPE=Release -DREFLEX_APP_BASE=0x08020000
          cmake --build build-slot -j
          test -f build-slot/reflex-fw.bin && test -f build-slot/reflex-fw.elf

          cmake -S bootloader -B bootloader/build -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build bootloader/build -j
          test -f bootloader/build/reflex-bl.bin && test -f bootloader/build/reflex-bl.elf

      # A diagnostic probe must never ship. It is compile-time selected, so a
      # release build cannot contain one -- but "cannot" is worth checking on
      # the thing that actually shipped rather than asserting in a comment.
      #
      # THE OBVIOUS CHECK CANNOT FAIL, and this step shipped it once before
      # anyone noticed (v1.1.0-rc.1). Grepping the ELF for `elsDiagCaptureStart`
      # / `elsDiagTick` finds nothing in a DIAGNOSTIC image either: the probe
      # entry points are `static inline`, so neither build emits a symbol for
      # them. Proven 2026-08-22 by building a real takeup-settle-v3 image and
      # running that exact grep against it -- zero hits, identical to a release
      # build. A guard that returns the same answer for both cases is not a
      # guard.
      #
      # The build CONFIGURATION is where the probe is genuinely selected, and it
      # does distinguish: 1 occurrence for a probe build, 0 for a release build,
      # both measured. Re-measured 2026-09-07 on the slotted configuration --
      # `cmake -S . -B <dir> -DREFLEX_APP_BASE=0x08020000
      # -DCMAKE_C_FLAGS=-DELS_DIAG_PROBE=ELS_DIAG_SCHEMA_TAKEUP_SETTLE_V3`, the
      # flags scripts/build.sh --diag passes -- also lands exactly 1.
      #
      # IT MUST COVER EVERY SHIPPED CONFIGURATION, and as of 2026-09-13 there
      # are two. This step used to inspect build/ alone, which was total
      # coverage when the legacy build/ was the only thing published; the same
      # step left unchanged beside two new build directories would have been
      # the worse thing than no guard -- a green check reading as "no
      # diagnostic ships" while the probe with a path to the FIELD, the one in
      # build-slot/ that the in-app updater flashes, went unexamined. That is
      # also why build/ came OUT of the loop on 2026-09-13 rather than being
      # left in: "Cross-build the release firmware" no longer configures it,
      # and the existence assertion below would then fail the release for a
      # directory nothing ships from. The rule is one cache per shipped
      # configuration, no more and no fewer.
      #
      # And it asserts each cache EXISTS before grepping. `grep -q` over a
      # missing file exits nonzero exactly like a clean cache does, so a
      # renamed or unbuilt directory would otherwise turn a loop iteration
      # into a silent pass -- the same "cannot fail" shape this comment was
      # written about in the first place.
      - name: Refuse to ship a diagnostic build
        working-directory: fw
        run: |
          fail=0
          for cache in build-slot/CMakeCache.txt bootloader/build/CMakeCache.txt; do
            if [ ! -f "$cache" ]; then
              echo "::error::$cache does not exist -- the diagnostic guard cannot see the configuration behind a binary this release ships."
              fail=1
            elif grep -q 'ELS_DIAG_PROBE' "$cache"; then
              echo "::error::$cache: this firmware was configured with a diagnostic probe."
              grep 'ELS_DIAG_PROBE' "$cache"
              fail=1
            else
              echo "ok: $cache carries no ELS_DIAG_PROBE"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # uv itself was installed before the stamp; this is the venv and the
      # install. --locked because the lock is now a RELEASE ARTIFACT: it was
      # regenerated and committed by the stamp step, and `uv sync` silently
      # rewriting it here is the precise behaviour that hid the defect for every
      # release before 2026-09-11. --locked turns that rewrite into a job
      # failure instead, so the tests below run against the resolution the tag
      # actually carries.
      - name: Sync the UI
        working-directory: ui
        run: |
          uv venv
          uv sync --locked

      # The gate. A release that has not run the suites is a guess, and the
      # system suite already ran on this commit's push, so this is the fast
      # pair: firmware emulator + the UI default suite.
      - name: Firmware emulator suite
        working-directory: fw/emulator
        run: |
          cmake -B build
          cmake --build build -j
          cd build && ctest --output-on-failure

      - name: UI default suite
        working-directory: ui
        env:
          REFLEX_FW_REQUIRED: "1"
        run: uv run pytest -q

      - name: Build the UI distribution
        working-directory: ui
        run: uv build

      # THE NAMES ARE THE CONTRACT. Two firmware binaries ship in the same
      # release, they are different layouts rather than different builds of
      # one thing, and only one of them is an application at all -- so the
      # names have to be un-confusable by a human reading the release page AND
      # by a glob:
      #
      #   reflex-app-<V>.bin  the RUN-slot image with the RFLX header. What
      #                       modbus-flash.py and the in-app updater take.
      #   reflex-bl-<V>.bin   the bootloader, sector 0.
      #
      # `reflex-app-` and not `reflex-fw-slot-`, which was the obvious name and
      # was the wrong one: `reflex-fw-*.bin` -- the glob the updater used, the
      # glob docs/setup/installing.md told operators to use, the glob anyone
      # writes by hand -- matches it, and back when a legacy `reflex-fw-<V>.bin`
      # asset still shipped alongside, that glob could silently take the
      # unflashable one. The asset is gone (see RETIRED below) but the name is
      # not coming back: releases published before 2026-09-13 still carry it,
      # and ui/reflex/utils/updater.py's anchored `^reflex-app-` pattern is
      # what keeps those old releases from being offered as installable.
      # It is also the vocabulary the system already speaks: the identity
      # window's two stages are `bootloader` and `application`, so bl/app names
      # the pair the slotted layout actually has and reads correctly next to
      # reflex-bl-<V>.bin.
      #
      # The bootloader ELF ships beside its .bin because fw/bootloader/README.md
      # step 4 provisions a virgin board with `program reflex-bl.elf`. The
      # slotted app ELF deliberately does NOT ship: it still holds the zero
      # length/CRC placeholders that reflex_image.py patches into the .bin, so
      # it is not a valid image, and the README says never to program it.
      #
      # --------------------------------------------------------------------
      # RETIRED 2026-09-13: the legacy `reflex-fw-<V>.bin` / `.elf` assets.
      #
      # They were the legacy no-bootloader layout at 0x08000000, kept for one
      # population -- boards still on that layout -- under an explicit end
      # condition: they ship until no such board remains. The known-legacy
      # list lived in fw/bootloader/README.md and emptied on 2026-09-12, when
      # a sector-0 dump over the real ST-Link classified elspi as BOOTLOADER
      # and it turned out to have been on the bootloader layout all along. The
      # list was never non-empty in fact, so the condition was met and the
      # asset stopped shipping.
      #
      # fw/scripts/flash.sh STAYS. The old note here paired the asset and the
      # script as "the same layout wearing two hats" and said to retire them
      # together; that coupling was false. flash.sh configures and builds
      # locally and programs `firmware/reflex-fw-<variant>.elf` from that
      # build -- it never downloaded or consumed a release asset, so removing
      # the asset takes nothing away from it. It remains the SWD recovery
      # tool: the only way into a board that will not answer over Modbus, and
      # the only thing that runs with nothing in sector 0.
      # --------------------------------------------------------------------
      - name: Collect the artifacts
        run: |
          mkdir -p dist
          V=${{ steps.v.outputs.version }}
          cp fw/build-slot/reflex-fw.bin "dist/reflex-app-$V.bin"
          cp fw/bootloader/build/reflex-bl.bin "dist/reflex-bl-$V.bin"
          cp fw/bootloader/build/reflex-bl.elf "dist/reflex-bl-$V.elf"
          cp ui/dist/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      # Gate on the BYTES THAT SHIP, not on the build log. reflex_image.py runs
      # as a POST_BUILD command that only the slotted configuration attaches
      # (fw/CMakeLists.txt, `if (REFLEX_SLOTTED)`). If that wiring ever comes
      # loose the build still succeeds and still writes a .bin -- an unheadered
      # one, which fails in the field at a stranger's preflight rather than
      # here. Reading dist/ rather than fw/build-slot/ is still the right end
      # of the pipe -- it is the file a stranger downloads -- though with only
      # one firmware `cp` left there is no longer a second binary for it to be
      # swapped with, so that particular mistake is now structural rather than
      # caught here.
      #
      # ONE DIRECTION IS ALL THAT IS LEFT, and it is worth being exact about
      # what it does and does not buy. Until 2026-09-13 this step asserted
      # both that reflex-app validates AND that the legacy reflex-fw asset
      # does NOT, because with two similarly-named files a swap could pass
      # either assertion alone. With the legacy asset retired there is no
      # second file to cross with, so the pair argument no longer applies.
      #
      # What the remaining check proves: the bytes in dist/reflex-app-$V.bin
      # carry a well-formed RFLX header whose length and CRC32 match their own
      # contents -- so the POST_BUILD reflex_image.py wiring did run, and the
      # file a stranger downloads is one modbus-flash.py's preflight will
      # accept rather than refuse after it has already erased.
      #
      # What it CANNOT prove: that the image is linked at 0x08020000, or that
      # it came from the slotted configuration rather than some other build
      # that happened to get a header patched in. A valid header is evidence
      # about the header, not about the link address. The load address is not
      # in the header, so nothing here reads it; the identity check below is
      # what ties these bytes to the tagged commit, and only the bootloader
      # itself refuses a wrongly-linked image, in the field.
      - name: Check each firmware asset is the layout its name claims
        run: |
          V=${{ steps.v.outputs.version }}
          python3 fw/scripts/reflex_image.py info "dist/reflex-app-$V.bin"
          echo "ok: reflex-app-$V.bin carries a valid RFLX header (length and CRC32 self-consistent)"

      # EVERY IMAGE MUST NAME THE COMMIT THE TAG POINTS AT, CLEAN -- read from
      # the bytes that ship. fw/scripts/release_identity.py finds the identity
      # window each firmware stage compiles into flash (the eight registers
      # the board answers at address 2048, which modbus-flash.py prints as
      # rev=<sha>[-dirty]) and, for the slotted image, the RFLX header's
      # buildRev and dirty flag as well. Both shipped images, for the
      # same reason the diagnostic guard covers both. Not finding a
      # window, or finding two, is a failure: a check that cannot see the
      # identity cannot vouch for it.
      #
      # The self-test runs first, against synthetic images: a clean one that
      # must pass, and dirty / wrong-commit / wrong-stage / missing / doubled
      # windows that must each fail. A guard that cannot fail is worse than
      # none -- the diagnostic guard above shipped that way once -- so every
      # release re-proves this one can. Seen red on REAL images 2026-09-11:
      # the three configurations built in the old order (stamp, build, then
      # commit) were all refused, reading <parent>-dirty instead of the stamp
      # commit; built in this order, all three passed.
      - name: Refuse to ship an image that is not the tagged commit, clean
        run: |
          V=${{ steps.v.outputs.version }}
          REV=${{ steps.v.outputs.sha }}
          python3 fw/scripts/release_identity.py self-test
          fail=0
          python3 fw/scripts/release_identity.py check "dist/reflex-app-$V.bin" --stage app        --rev "$REV" --slotted || fail=1
          python3 fw/scripts/release_identity.py check "dist/reflex-bl-$V.bin"  --stage bootloader --rev "$REV"           || fail=1
          if [ "$fail" != 0 ]; then
            echo "::error::a shipped firmware image does not identify as ${REV:0:7}, clean -- it was not built from the commit this release tags."
            exit 1
          fi

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Stop here (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry run: built and checked $TAG, publishing nothing"

      # The tag is already here, pushed together with its branch; this only
      # creates the release for it. --verify-tag refuses rather than letting the
      # CLI create a tag of its own if the tag were somehow missing.
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          # --notes-file together with --generate-notes: the written notes come
          # first and the generated changelog is appended beneath them.
          FLAGS="--verify-tag --notes-file release-notes/$V.md --generate-notes"
          [ "${{ steps.v.outputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$TAG" dist/* --title "reflex $TAG" $FLAGS
          echo "published $TAG"
