# Lockstep release: ONE version, ONE tag, ONE release carrying BOTH halves.
#
# This is the flow decisions/repo-structure-monorepo.md specifies and the
# monorepo has been missing since the 2026-08-17 weld. Its whole point is that
# `v1.4.0` names a known-good FIRMWARE + UI PAIR, so "which firmware does this
# UI expect?" is answered by the version number instead of tribal knowledge.
# Both halves therefore carry the same version even when only one changed; a
# byte-identical binary simply does not get re-deployed.
#
# DELIBERATE, NOT AUTOMATIC, and that is a change from the split era. The old
# reflex-fw/reflex-ui release workflows fired on every push to main/dev, which
# is where the habit of writing `[skip ci]` came from -- a marker that on every
# other branch silently deleted the test run instead (see ui/AGENTS.md). Here a
# release happens when someone asks for one, so no push needs a marker to
# suppress it and the test workflows are never in the firing line.
#
# The version is passed in rather than derived. python-semantic-release was
# retired with the split repos: its config had accumulated v7 keys that PSR 10
# silently ignores, so options read like live settings while doing nothing, and
# nobody could say from the file what a push would do. An explicit input cannot
# drift like that -- and the release notes are generated from the conventional
# commits either way, so the log still does the describing.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version WITHOUT the leading v (e.g. 1.1.0 or 1.1.0-rc.1). A hyphen makes it a pre-release.'
        required: true
        type: string
      dry_run:
        description: 'Build and check everything, then stop before tagging or publishing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # release notes need the history since the last tag

      # ── Guards, before anything is built ──────────────────────────────────
      # A release is a promise about a branch that has been through the ladder.
      # integration and feature branches have not.
      - name: Check the branch is releasable
        run: |
          case "${{ github.ref_name }}" in
            main) echo "main: full release" ;;
            dev)  echo "dev: pre-release" ;;
            *)    echo "::error::release can only run from main or dev; got '${{ github.ref_name }}'. Promote through the ladder first." ; exit 1 ;;
          esac

      - name: Check the version and match it to the branch
        id: v
        run: |
          V='${{ inputs.version }}'
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::'$V' is not a semver version (no leading v)."; exit 1; }
          if echo "$V" | grep -q -- '-'; then PRE=true; else PRE=false; fi
          # dev ships pre-releases, main ships finals. Crossing them is how a
          # release-candidate ends up looking like a release.
          if [ "${{ github.ref_name }}" = "main" ] && [ "$PRE" = "true" ]; then
            echo "::error::main takes a final version; '$V' is a pre-release."; exit 1
          fi
          if [ "${{ github.ref_name }}" = "dev" ] && [ "$PRE" = "false" ]; then
            echo "::error::dev takes a pre-release (e.g. $V-rc.1); '$V' is final."; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists."; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      # ── Build both halves ─────────────────────────────────────────────────
      # Package list mirrors fw.yml's arm-build; the two must stay in step so
      # the CI guard actually reproduces what ships.
      - name: Install ARM toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y \
            coreutils procps make cmake \
            build-essential gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib \
            libnewlib-arm-none-eabi

      - name: Stamp the version
        run: |
          echo "${{ steps.v.outputs.version }}" > VERSION
          # ui is a Python package and carries its own version field; keep it
          # equal to the repo's rather than letting the two drift.
          sed -i -E '0,/^version = ".*"$/s//version = "${{ steps.v.outputs.version }}"/' ui/pyproject.toml
          grep -m1 '^version = ' ui/pyproject.toml

      # THREE firmware binaries ship and they are NOT interchangeable. Until
      # 2026-09-07 only the first was built, which meant the only firmware a
      # release published was the one the field updater cannot flash.
      #
      #   build/         legacy monolith at 0x08000000, no image header. What
      #                  scripts/flash.sh writes over SWD, and the only thing
      #                  that runs on a board with nothing in sector 0. The
      #                  recovery image.
      #   build-slot/    the SAME application linked at the bootloader's RUN
      #                  slot, 0x08020000, with the RFLX header at +0x200
      #                  patched in post-build by scripts/reflex_image.py. This
      #                  is the ONLY form fw/scripts/modbus-flash.py -- and so
      #                  the in-app updater, ui/reflex/utils/updater.py -- will
      #                  accept; a legacy binary is refused at its preflight.
      #   bootloader/    sector 0 itself. A virgin board has no bootloader and
      #                  flash.sh installs none, so without this asset the
      #                  over-the-wire path cannot be reached at all.
      #
      # Separate build directories per configuration, the way DIAG.md keeps
      # diagnostic builds apart: one directory reconfigured twice would leave
      # a stale cache deciding what the second build meant.
      - name: Cross-build the release firmware
        working-directory: fw
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          test -f build/reflex-fw.bin && test -f build/reflex-fw.elf

          cmake -S . -B build-slot -DCMAKE_BUILD_TYPE=Release -DREFLEX_APP_BASE=0x08020000
          cmake --build build-slot -j
          test -f build-slot/reflex-fw.bin && test -f build-slot/reflex-fw.elf

          cmake -S bootloader -B bootloader/build -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build bootloader/build -j
          test -f bootloader/build/reflex-bl.bin && test -f bootloader/build/reflex-bl.elf

      # A diagnostic probe must never ship. It is compile-time selected, so a
      # release build cannot contain one -- but "cannot" is worth checking on
      # the thing that actually shipped rather than asserting in a comment.
      #
      # THE OBVIOUS CHECK CANNOT FAIL, and this step shipped it once before
      # anyone noticed (v1.1.0-rc.1). Grepping the ELF for `elsDiagCaptureStart`
      # / `elsDiagTick` finds nothing in a DIAGNOSTIC image either: the probe
      # entry points are `static inline`, so neither build emits a symbol for
      # them. Proven 2026-08-22 by building a real takeup-settle-v3 image and
      # running that exact grep against it -- zero hits, identical to a release
      # build. A guard that returns the same answer for both cases is not a
      # guard.
      #
      # The build CONFIGURATION is where the probe is genuinely selected, and it
      # does distinguish: 1 occurrence for a probe build, 0 for a release build,
      # both measured. Re-measured 2026-09-07 on the slotted configuration --
      # `cmake -S . -B <dir> -DREFLEX_APP_BASE=0x08020000
      # -DCMAKE_C_FLAGS=-DELS_DIAG_PROBE=ELS_DIAG_SCHEMA_TAKEUP_SETTLE_V3`, the
      # flags scripts/build.sh --diag passes -- also lands exactly 1.
      #
      # IT MUST COVER EVERY SHIPPED CONFIGURATION, and as of 2026-09-07 there
      # are three. This step used to inspect build/ alone, which was total
      # coverage when build/ was the only thing published; the same step left
      # unchanged beside two new build directories would have been the worse
      # thing than no guard -- a green check reading as "no diagnostic ships"
      # while the probe with a path to the FIELD, the one in build-slot/ that
      # the in-app updater flashes, went unexamined.
      #
      # And it asserts each cache EXISTS before grepping. `grep -q` over a
      # missing file exits nonzero exactly like a clean cache does, so a
      # renamed or unbuilt directory would otherwise turn a loop iteration
      # into a silent pass -- the same "cannot fail" shape this comment was
      # written about in the first place.
      - name: Refuse to ship a diagnostic build
        working-directory: fw
        run: |
          fail=0
          for cache in build/CMakeCache.txt build-slot/CMakeCache.txt bootloader/build/CMakeCache.txt; do
            if [ ! -f "$cache" ]; then
              echo "::error::$cache does not exist -- the diagnostic guard cannot see the configuration behind a binary this release ships."
              fail=1
            elif grep -q 'ELS_DIAG_PROBE' "$cache"; then
              echo "::error::$cache: this firmware was configured with a diagnostic probe."
              grep 'ELS_DIAG_PROBE' "$cache"
              fail=1
            else
              echo "ok: $cache carries no ELS_DIAG_PROBE"
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Install uv and sync the UI
        working-directory: ui
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv sync

      # The gate. A release that has not run the suites is a guess, and the
      # system suite already ran on this commit's push, so this is the fast
      # pair: firmware emulator + the UI default suite.
      - name: Firmware emulator suite
        working-directory: fw/emulator
        run: |
          cmake -B build
          cmake --build build -j
          cd build && ctest --output-on-failure

      - name: UI default suite
        working-directory: ui
        env:
          REFLEX_FW_REQUIRED: "1"
        run: uv run pytest -q

      - name: Build the UI distribution
        working-directory: ui
        run: uv build

      # THE NAMES ARE THE CONTRACT. Two firmware binaries built from the same
      # source ship in the same release and only one of them can be flashed
      # over the wire, so the names have to be un-confusable by a human reading
      # the release page AND by a glob:
      #
      #   reflex-fw-<V>.bin   legacy 0x08000000, SWD/flash.sh. UNCHANGED in
      #                       name and in meaning -- people and scripts
      #                       downstream already expect exactly this.
      #                       DEPRECATED since 2026-09-08; see the end
      #                       condition further down this block.
      #   reflex-app-<V>.bin  the RUN-slot image with the RFLX header. What
      #                       modbus-flash.py and the in-app updater take.
      #   reflex-bl-<V>.bin   the bootloader, sector 0.
      #
      # `reflex-app-` and not `reflex-fw-slot-`, which was the obvious name and
      # is the wrong one: `reflex-fw-*.bin` -- the glob the updater used, the
      # glob docs/setup/installing.md told operators to use, the glob anyone
      # writes by hand -- matches it. No prefix can select one of these two and
      # accidentally take the other, because neither is a prefix of the other.
      # It is also the vocabulary the system already speaks: the identity
      # window's two stages are `bootloader` and `application`, so bl/app names
      # the pair the slotted layout actually has and reads correctly next to
      # reflex-bl-<V>.bin.
      #
      # The bootloader ELF ships beside its .bin because fw/bootloader/README.md
      # step 4 provisions a virgin board with `program reflex-bl.elf`. The
      # slotted app ELF deliberately does NOT ship: it still holds the zero
      # length/CRC placeholders that reflex_image.py patches into the .bin, so
      # it is not a valid image, and the README says never to program it.
      #
      # --------------------------------------------------------------------
      # reflex-fw-<V>.bin AND .elf ARE DEPRECATED, AND THEY HAVE AN END
      # CONDITION. Added 2026-09-08.
      #
      # They are the legacy no-bootloader layout, and they exist for exactly
      # one population: boards built before 2026-09-07, plus any board a
      # `flash.sh --force-legacy` run has deliberately taken back there. A new
      # board does NOT get them -- fw/scripts/provision.sh programs reflex-bl
      # + reflex-app -- and a board built from them cannot be updated over the
      # wire at all, which is the entire reason the slotted layout exists.
      #
      # THEY SHIP UNTIL NO BOARD ON THE LEGACY LAYOUT REMAINS, AND THEN THEY
      # STOP. That is the whole condition. Known legacy boards as of
      # 2026-09-08: elspi. The list is kept in fw/bootloader/README.md next to
      # the same note; when it empties, retire these four things together:
      #
      #   1. the legacy `cmake -S . -B build ...` in "Cross-build the release
      #      firmware" above,
      #   2. the two `cp fw/build/reflex-fw.*` lines in this step,
      #   3. the legacy half of "Check each firmware asset is the layout its
      #      name claims" below -- the reflex-fw-must-NOT-validate check,
      #   4. fw/scripts/flash.sh, which writes this same layout and is the only
      #      thing that consumes it.
      #
      # Do not retire them one at a time. An asset with no script to flash it,
      # or a script with no asset to feed it, is worse than either half.
      # --------------------------------------------------------------------
      - name: Collect the artifacts
        run: |
          mkdir -p dist
          V=${{ steps.v.outputs.version }}
          cp fw/build/reflex-fw.bin "dist/reflex-fw-$V.bin"
          cp fw/build/reflex-fw.elf "dist/reflex-fw-$V.elf"
          cp fw/build-slot/reflex-fw.bin "dist/reflex-app-$V.bin"
          cp fw/bootloader/build/reflex-bl.bin "dist/reflex-bl-$V.bin"
          cp fw/bootloader/build/reflex-bl.elf "dist/reflex-bl-$V.elf"
          cp ui/dist/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      # Gate on the BYTES THAT SHIP, not on the build log. reflex_image.py runs
      # as a POST_BUILD command that only the slotted configuration attaches
      # (fw/CMakeLists.txt, `if (REFLEX_SLOTTED)`). If that wiring ever comes
      # loose the build still succeeds and still writes a .bin -- an unheadered
      # one, which fails in the field at a stranger's preflight rather than
      # here. Reading dist/ rather than fw/build-slot/ also means a swapped
      # `cp` above is caught, which is the specific mistake this naming exists
      # to make impossible.
      #
      # BOTH directions, because each assertion alone has a whole failure it
      # structurally cannot see. "reflex-app is a valid image" never opens the
      # legacy file, so publishing the SLOTTED binary under both names passes
      # it -- and that one is silent until someone tries to recover a board
      # over SWD with a 0x08020000 image. "reflex-fw has no header" is true of
      # essentially any file, including an unheadered reflex-app. Only the pair
      # pins one of each.
      - name: Check each firmware asset is the layout its name claims
        run: |
          V=${{ steps.v.outputs.version }}
          python3 fw/scripts/reflex_image.py info "dist/reflex-app-$V.bin"
          if python3 fw/scripts/reflex_image.py info "dist/reflex-fw-$V.bin" >/dev/null 2>&1; then
            echo "::error::dist/reflex-fw-$V.bin validates as a slotted image -- the legacy and slotted builds have been crossed."
            exit 1
          fi
          echo "ok: reflex-fw-$V.bin is the legacy layout (no RFLX header), reflex-app-$V.bin is the slotted image"

      # ── Publish ───────────────────────────────────────────────────────────
      - name: Stop here (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry run — built and checked v${{ steps.v.outputs.version }}, publishing nothing"

      - name: Commit the version, tag it, push
        if: ${{ !inputs.dry_run }}
        run: |
          # NOT the inherited identity. reflex-fw's split-era release workflow
          # tagged as bartei81@gmail.com, carried over from the upstream fork --
          # releases signed by someone who has never worked on this project.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION ui/pyproject.toml
          git commit -m "chore(release): v${{ steps.v.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.v.outputs.version }}" -m "reflex v${{ steps.v.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.v.outputs.version }}"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          FLAGS="--generate-notes --target ${{ github.ref_name }}"
          [ "${{ steps.v.outputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "v$V" dist/* --title "reflex v$V" $FLAGS
          echo "published v$V from ${{ github.ref_name }}"
